# Production values for the chromium-browser-gateway chart.
replicaCount: 3
image:
  repository: registry.corp.internal/platform/chromium-browser-gateway
  tag: 1.4.2-corp.1
resources:
  limits:
    cpu: "4"
    memory: 8Gi
env:
  - name: DEPOSITS_PRODUCT_CATALOG_EMEA_URL
    value: https://deposits-product-catalog-emea.svc.corp.internal/api/v1
  # Identity API Gateway AMER
  - name: IDENTITY_API_GATEWAY_AMER_URL
    value: https://identity-api-gateway-amer.svc.corp.internal/api/v1
  - name: MORTGAGES_REPAYMENT_SCHEDULER_APAC_URL
    value: https://mortgages-repayment-scheduler-apac.svc.corp.internal/api/v1
  # Rates Execution Gateway EMEA
  - name: RATES_EXECUTION_GATEWAY_EMEA_URL
    value: https://rates-execution-gateway-emea.svc.corp.internal/api/v1
ingress:
  enabled: true
  host: chromium-browser.corp.internal
  allowedSourceNamespaces:
    - swift-reconciliation-apac
